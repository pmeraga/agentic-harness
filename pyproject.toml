[project]
name = "agentic-harness"
version = "0.1.0"
description = "Durable Docker benchmark execution for interchangeable agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click==8.3.1"]

[dependency-groups]
dev = ["pytest==8.3.5"]

[project.scripts]
harness = "agentic_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["docker: requires Docker daemon and built images"]
